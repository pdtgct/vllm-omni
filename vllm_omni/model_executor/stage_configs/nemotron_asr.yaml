# Nemotron cache-aware streaming RNN-T ASR — single-stage deploy
# (PORT-INT-001; step_audio_2_asr.yaml pattern). Sampling defaults
# here are advisory: pipeline.py sampling_constraints win the merge.
stages:
  - stage_id: 0
    stage_type: llm
    worker_type: ar
    scheduler_cls: OmniARScheduler
    engine_args:
      model_arch: Nemotron3_5AsrForRNNT
      # @spec PORT-INT-007: safe parity-lane defaults belong to the
      # configured Omni stage, not top-level flags that it overrides.
      dtype: float32
      enforce_eager: true
      enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.0
